<svg viewBox="0 0 1600 910" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a93"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d8a3a"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/></filter>
  </defs>

  <rect x="0" y="0" width="1600" height="910" fill="#f5f5f3"/>

  <text x="48" y="56" font-size="28" font-weight="700" fill="#1b1b1f">Supergoal</text>
  <text x="48" y="84" font-size="14" fill="#6b6b73">Plan samen, bouw autonoom, bewijs onafhankelijk. Een skill voor Claude Code en Codex.</text>

  <!-- ============ OVERVIEW FLOW ============ -->
  <rect x="48" y="128" width="210" height="62" rx="12" fill="#FFE6CC" stroke="#D79B00" stroke-width="2" filter="url(#sh)"/>
  <text x="153" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1b1f">Jouw taak</text>
  <line x1="260" y1="159" x2="305" y2="159" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="307" y="128" width="210" height="62" rx="12" fill="#FFF2CC" stroke="#D6B656" stroke-width="2" filter="url(#sh)"/>
  <text x="412" y="154" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1b1f">Plannen samen</text>
  <text x="412" y="173" text-anchor="middle" font-size="10.5" fill="#9a7b1f">jij beslist</text>
  <line x1="519" y1="159" x2="564" y2="159" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="566" y="128" width="210" height="62" rx="12" fill="#D5E8D4" stroke="#82B366" stroke-width="2" filter="url(#sh)"/>
  <text x="671" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1b1f">Context</text>
  <line x1="778" y1="159" x2="823" y2="159" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="825" y="128" width="210" height="62" rx="12" fill="#FFF2CC" stroke="#D6B656" stroke-width="2" filter="url(#sh)"/>
  <text x="930" y="154" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1b1f">Plan-review</text>
  <text x="930" y="173" text-anchor="middle" font-size="10.5" fill="#9a7b1f">jij beslist</text>
  <line x1="1037" y1="159" x2="1082" y2="159" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1084" y="128" width="210" height="62" rx="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" filter="url(#sh)"/>
  <text x="1189" y="154" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1b1f">Autonome run</text>
  <text x="1189" y="173" text-anchor="middle" font-size="10.5" fill="#4f6a8c">bouwen + bewijzen</text>
  <line x1="1296" y1="159" x2="1341" y2="159" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1343" y="128" width="210" height="62" rx="12" fill="#D5E8D4" stroke="#5d8a3a" stroke-width="2.5" filter="url(#sh)"/>
  <text x="1448" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1b1f">Klaar</text>

  <text x="800" y="218" text-anchor="middle" font-size="12.5" fill="#6b6b73">Twee keer beslis jij: bij het plannen en bij de review. Daartussen draait het autonoom tot klaar.</text>

  <!-- ============ SEPARATOR ============ -->
  <line x1="48" y1="250" x2="1552" y2="250" stroke="#e0e0dd" stroke-width="1.5"/>
  <text x="48" y="278" font-size="16" font-weight="700" fill="#3a3a42">Onder de motorkap</text>
  <text x="48" y="296" font-size="11.5" fill="#8a8a8f">De drie kernonderdelen uit de flow hierboven, uitgelicht.</text>

  <!-- ====== CARD 1: CONTEXT ====== -->
  <rect x="48" y="312" width="476" height="556" rx="14" fill="#ffffff" stroke="#e4e4ea" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="70" y="332" width="82" height="24" rx="12" fill="#D5E8D4" stroke="#82B366" stroke-width="1.2"/>
  <text x="111" y="348" text-anchor="middle" font-size="11" font-weight="700" fill="#2f4a25">context</text>
  <text x="70" y="386" font-size="16" font-weight="700" fill="#1b1b1f">Context verzamelen</text>
  <text x="70" y="407" font-size="11.5" fill="#6b6b73">vier bronnen, dan twee checks die elkaar tegenspreken</text>

  <rect x="74" y="424" width="204" height="42" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <text x="176" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="#28391f">Code</text>
  <rect x="294" y="424" width="204" height="42" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <text x="396" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="#28391f">Docs</text>
  <rect x="74" y="476" width="204" height="42" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <text x="176" y="502" text-anchor="middle" font-size="13" font-weight="600" fill="#28391f">MCP's</text>
  <rect x="294" y="476" width="204" height="42" rx="9" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <text x="396" y="502" text-anchor="middle" font-size="13" font-weight="600" fill="#28391f">Skills</text>

  <line x1="286" y1="518" x2="286" y2="540" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="76" y="542" width="420" height="50" rx="10" fill="#D5E8D4" stroke="#5d8a3a" stroke-width="2"/>
  <text x="286" y="564" text-anchor="middle" font-size="13.5" font-weight="700" fill="#28391f">Genoeg context?</text>
  <text x="286" y="581" text-anchor="middle" font-size="11" fill="#41603a">sufficient-judge: is het compleet</text>

  <line x1="286" y1="592" x2="286" y2="610" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="76" y="612" width="420" height="50" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="286" y="634" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a02c20">Tegencheck</text>
  <text x="286" y="651" text-anchor="middle" font-size="11" fill="#a02c20">adversarial prober: zoekt een gat</text>

  <path d="M 96 662 L 60 662 L 60 445 L 74 445" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <text x="70" y="700" font-size="11" font-style="italic" fill="#7a7a82">De ene checkt of de context compleet is, de</text>
  <text x="70" y="716" font-size="11" font-style="italic" fill="#7a7a82">andere zoekt juist een gat. Gat gevonden, dan</text>
  <text x="70" y="732" font-size="11" font-style="italic" fill="#7a7a82">eerst meer ophalen voor het plannen begint.</text>

  <!-- ====== CARD 2: KEUZE ====== -->
  <rect x="562" y="312" width="476" height="556" rx="14" fill="#ffffff" stroke="#e4e4ea" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="584" y="332" width="70" height="24" rx="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.2"/>
  <text x="619" y="348" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4870">keuze</text>
  <text x="584" y="386" font-size="16" font-weight="700" fill="#1b1b1f">Hoe het bouwt</text>
  <text x="584" y="407" font-size="11.5" fill="#6b6b73">kiest automatisch, op vraag en budget</text>

  <rect x="584" y="424" width="432" height="128" rx="10" fill="#f7f9fc" stroke="#d7ddea" stroke-width="1.2"/>
  <text x="600" y="446" font-size="12.5" font-weight="700" fill="#3a3a42">patroon</text>
  <text x="664" y="446" font-size="10.5" fill="#8a8a8f">kiest 1 van 6</text>
  <text x="602" y="472" font-size="11" fill="#3a567a">classify-and-act</text>
  <text x="812" y="472" font-size="11" fill="#3a567a">generate-and-filter</text>
  <text x="602" y="496" font-size="11" fill="#3a567a">fan-out</text>
  <text x="812" y="496" font-size="11" fill="#3a567a">tournament</text>
  <text x="602" y="520" font-size="11" fill="#3a567a">adversarial verify</text>
  <text x="812" y="520" font-size="11" fill="#3a567a">loop-until-done</text>

  <rect x="584" y="566" width="432" height="66" rx="10" fill="#f7f9fc" stroke="#d7ddea" stroke-width="1.2"/>
  <text x="600" y="588" font-size="12.5" font-weight="700" fill="#3a3a42">zwaarte</text>
  <rect x="600" y="600" width="126" height="24" rx="12" fill="#DAE8FC" stroke="#4f79b0" stroke-width="1.5"/>
  <text x="663" y="616" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f3a5c">sequentieel</text>
  <text x="731" y="617" font-size="12" font-weight="700" fill="#9aa0a8">&#8250;</text>
  <rect x="740" y="600" width="104" height="24" rx="12" fill="#eaf1fb" stroke="#8aa6cc" stroke-width="1.2"/>
  <text x="792" y="616" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3a567a">subagents</text>
  <text x="849" y="617" font-size="12" font-weight="700" fill="#9aa0a8">&#8250;</text>
  <rect x="858" y="600" width="150" height="24" rx="12" fill="#eaf1fb" stroke="#8aa6cc" stroke-width="1.2"/>
  <text x="933" y="616" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3a567a">Workflow-swarm</text>

  <rect x="584" y="646" width="432" height="66" rx="10" fill="#f7f9fc" stroke="#d7ddea" stroke-width="1.2"/>
  <text x="600" y="668" font-size="12.5" font-weight="700" fill="#3a3a42">modus</text>
  <rect x="600" y="680" width="200" height="24" rx="12" fill="#ffffff" stroke="#6C8EBF" stroke-width="1.2"/>
  <text x="700" y="696" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2c4870">/goal, bouw tot klaar</text>
  <rect x="812" y="680" width="196" height="24" rx="12" fill="#ffffff" stroke="#6C8EBF" stroke-width="1.2"/>
  <text x="910" y="696" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2c4870">/loop, terugkerend</text>

  <text x="584" y="748" font-size="11" font-style="italic" fill="#7a7a82">Patroon is de vorm, zwaarte hoe groot, modus</text>
  <text x="584" y="764" font-size="11" font-style="italic" fill="#7a7a82">eenmalig of terugkerend. Niet eenduidig? Dan</text>
  <text x="584" y="780" font-size="11" font-style="italic" fill="#7a7a82">kiest een lichte classifier-agent het patroon.</text>

  <!-- ====== CARD 3: DE KERN (moat) ====== -->
  <rect x="1076" y="312" width="476" height="556" rx="14" fill="#ffffff" stroke="#4f79b0" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="1098" y="332" width="90" height="24" rx="12" fill="#C7DCF7" stroke="#4f79b0" stroke-width="1.2"/>
  <text x="1143" y="348" text-anchor="middle" font-size="11" font-weight="700" fill="#16314f">de kern</text>
  <text x="1098" y="386" font-size="16" font-weight="700" fill="#1b1b1f">Bouwen en bewijzen</text>
  <text x="1098" y="407" font-size="11.5" fill="#6b6b73">de bouwer keurt nooit zijn eigen werk</text>

  <rect x="1110" y="424" width="408" height="56" rx="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2"/>
  <text x="1314" y="447" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b1b1f">Generator: lead bouwt de fase</text>
  <text x="1314" y="465" text-anchor="middle" font-size="11" fill="#5b5b63">levert ruw bewijs, geen oordeel</text>

  <text x="1314" y="496" text-anchor="middle" font-size="10" fill="#8a8a8f">team van specialisten, skill via skill-finder</text>
  <rect x="1110" y="502" width="128" height="36" rx="9" fill="#eaf1fb" stroke="#8aa6cc" stroke-width="1.2"/>
  <text x="1174" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#3a567a">installed</text>
  <rect x="1250" y="502" width="128" height="36" rx="9" fill="#eaf1fb" stroke="#8aa6cc" stroke-width="1.2"/>
  <text x="1314" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#3a567a">skills.sh</text>
  <rect x="1390" y="502" width="128" height="36" rx="9" fill="#eaf1fb" stroke="#8aa6cc" stroke-width="1.2"/>
  <text x="1454" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#3a567a">zelf</text>

  <line x1="1314" y1="538" x2="1314" y2="556" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1098" y="558" width="432" height="88" rx="12" fill="#C7DCF7" stroke="#4f79b0" stroke-width="3" filter="url(#sh)"/>
  <text x="1314" y="585" text-anchor="middle" font-size="16" font-weight="700" fill="#16314f">Onafhankelijke evaluator</text>
  <text x="1314" y="605" text-anchor="middle" font-size="11.5" fill="#314a66">verse context, herdraait elke check</text>
  <text x="1314" y="621" text-anchor="middle" font-size="11.5" fill="#314a66">op de echte app</text>
  <text x="1314" y="639" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16314f">ACCEPT of REJECT</text>

  <path d="M 1098 600 L 1086 600 L 1086 452 L 1110 452" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="1080" y="530" text-anchor="middle" font-size="10" font-weight="600" fill="#c0392b" transform="rotate(-90 1080 530)">REJECT, max 3x</text>

  <line x1="1314" y1="646" x2="1314" y2="680" stroke="#5d8a3a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="1326" y="668" font-size="11" font-weight="700" fill="#5d8a3a">ACCEPT</text>

  <rect x="1140" y="682" width="348" height="50" rx="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2"/>
  <text x="1314" y="704" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1b1f">Eindaudit tegen het plan</text>
  <text x="1314" y="720" text-anchor="middle" font-size="10.5" fill="#5b5b63">tegen de oorspronkelijke opdracht</text>

  <line x1="1314" y1="732" x2="1314" y2="750" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1224" y="752" width="180" height="48" rx="10" fill="#D5E8D4" stroke="#5d8a3a" stroke-width="2.5"/>
  <text x="1314" y="782" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1b1f">Klaar</text>

  <text x="1098" y="826" font-size="11" font-style="italic" fill="#7a7a82">Bewijs is de echte app draaien, niet tests</text>
  <text x="1098" y="842" font-size="11" font-style="italic" fill="#7a7a82">groen. Generator en evaluator zijn strikt</text>
  <text x="1098" y="858" font-size="11" font-style="italic" fill="#7a7a82">gescheiden, dus meer agents kopen geen vertrouwen.</text>
</svg>

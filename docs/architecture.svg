<svg viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a93"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d8a3a"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/></filter>
    <filter id="shn" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter>
  </defs>

  <rect x="0" y="0" width="1200" height="980" fill="#fafaf9"/>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#1b1b1f">Supergoal</text>
  <text x="40" y="76" font-size="15" fill="#6b6b73">Plan samen, bouw autonoom, bewijs onafhankelijk. Een skill voor Claude Code en Codex.</text>

  <!-- central pipeline, centered on x=600 -->
  <rect x="430" y="104" width="340" height="56" rx="12" fill="#FFE6CC" stroke="#D79B00" stroke-width="2" filter="url(#shn)"/>
  <text x="600" y="138" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1b1f">Jouw taak</text>
  <line x1="600" y1="160" x2="600" y2="186" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="430" y="188" width="340" height="68" rx="12" fill="#E1D5E7" stroke="#9673A6" stroke-width="2" filter="url(#shn)"/>
  <text x="600" y="219" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1b1f">1. Plannen samen</text>
  <text x="600" y="240" text-anchor="middle" font-size="12.5" fill="#5b5b63">interview, een scherpe vraag per keer</text>
  <line x1="600" y1="256" x2="600" y2="282" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="430" y="284" width="340" height="68" rx="12" fill="#D5E8D4" stroke="#82B366" stroke-width="2" filter="url(#shn)"/>
  <text x="600" y="315" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1b1f">2. Context verzamelen</text>
  <text x="600" y="336" text-anchor="middle" font-size="12.5" fill="#5b5b63">vier bronnen, een check en een tegencheck</text>
  <line x1="600" y1="352" x2="600" y2="378" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="430" y="380" width="340" height="68" rx="12" fill="#FFF2CC" stroke="#D6B656" stroke-width="2" filter="url(#shn)"/>
  <text x="600" y="411" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1b1f">3. Plan-review</text>
  <text x="600" y="432" text-anchor="middle" font-size="12.5" fill="#5b5b63">jij keurt het plan goed (de enige stop)</text>
  <line x1="600" y1="448" x2="600" y2="486" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <!-- autonomous run box -->
  <rect x="340" y="488" width="520" height="258" rx="16" fill="#f1f1f4" stroke="#c9c9d1" stroke-width="2"/>
  <text x="362" y="514" font-size="14" font-weight="700" fill="#3a3a42">Autonome run onder een /goal</text>
  <text x="362" y="533" font-size="12" fill="#6b6b73">fase voor fase, ook urenlang, zonder babysitten</text>

  <rect x="430" y="552" width="340" height="64" rx="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" filter="url(#shn)"/>
  <text x="600" y="582" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1b1f">Generator bouwt de fase</text>
  <text x="600" y="601" text-anchor="middle" font-size="12.5" fill="#5b5b63">en levert ruw bewijs op, geen oordeel</text>
  <line x1="600" y1="616" x2="600" y2="650" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="430" y="652" width="340" height="76" rx="12" fill="#C7DCF7" stroke="#4f79b0" stroke-width="2.5" filter="url(#sh)"/>
  <text x="600" y="680" text-anchor="middle" font-size="16" font-weight="700" fill="#16314f">Onafhankelijke evaluator</text>
  <text x="600" y="700" text-anchor="middle" font-size="12.5" fill="#314a66">doet elke check zelf opnieuw</text>
  <text x="600" y="718" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16314f">ACCEPT of REJECT</text>

  <!-- reject loop inside the box, left of the nodes -->
  <path d="M 430 702 L 402 702 L 402 584 L 430 584" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <!-- accept out of box -->
  <line x1="600" y1="746" x2="600" y2="786" stroke="#5d8a3a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="612" y="770" font-size="12" font-weight="600" fill="#5d8a3a">ACCEPT</text>

  <rect x="430" y="788" width="340" height="60" rx="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" filter="url(#shn)"/>
  <text x="600" y="817" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1b1f">Eindaudit tegen het plan</text>
  <text x="600" y="836" text-anchor="middle" font-size="12.5" fill="#5b5b63">opnieuw, tegen de oorspronkelijke opdracht</text>
  <line x1="600" y1="848" x2="600" y2="880" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>

  <rect x="480" y="882" width="240" height="56" rx="12" fill="#D5E8D4" stroke="#5d8a3a" stroke-width="2.5" filter="url(#shn)"/>
  <text x="600" y="916" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1f">Klaar</text>

  <!-- STICKY NOTES, straight, left column (x 28..314) -->
  <rect x="28" y="276" width="286" height="86" rx="3" fill="#FEF3A3" stroke="#D9B40A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="300" font-size="12.5" font-weight="700" fill="#5b4b00">Eerst echt uitzoeken</text>
  <text x="42" y="320" font-size="12" fill="#5b4b00">Code, docs, MCP's en skills. Een</text>
  <text x="42" y="336" font-size="12" fill="#5b4b00">check of het genoeg is, plus een</text>
  <text x="42" y="352" font-size="12" fill="#5b4b00">die juist een gat probeert te vinden.</text>

  <rect x="28" y="540" width="286" height="72" rx="3" fill="#FEF3A3" stroke="#D9B40A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="564" font-size="12.5" font-weight="700" fill="#5b4b00">Overleeft lange runs</text>
  <text x="42" y="584" font-size="12" fill="#5b4b00">Plan en voortgang op schijf, dus</text>
  <text x="42" y="600" font-size="12" fill="#5b4b00">context-verlies gooit niks weg.</text>

  <rect x="28" y="628" width="286" height="72" rx="3" fill="#FEF3A3" stroke="#D9B40A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="652" font-size="12.5" font-weight="700" fill="#5b4b00">Stuk? Terugrollen</text>
  <text x="42" y="672" font-size="12" fill="#5b4b00">Een regressie gaat terug naar de</text>
  <text x="42" y="688" font-size="12" fill="#5b4b00">baseline van de vorige fase.</text>

  <!-- STICKY NOTES, straight, right column (x 886..1172) -->
  <rect x="886" y="176" width="286" height="86" rx="3" fill="#FEF3A3" stroke="#D9B40A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="900" y="200" font-size="12.5" font-weight="700" fill="#5b4b00">Jij blijft de architect</text>
  <text x="900" y="220" font-size="12" fill="#5b4b00">Hij praat je bij met artikelen en</text>
  <text x="900" y="236" font-size="12" fill="#5b4b00">scenario's, en vraagt een keuze</text>
  <text x="900" y="252" font-size="12" fill="#5b4b00">per keer met een aanbeveling.</text>

  <rect x="886" y="640" width="286" height="100" rx="3" fill="#FEF3A3" stroke="#D9B40A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="900" y="664" font-size="12.5" font-weight="700" fill="#5b4b00">De kern van het verschil</text>
  <text x="900" y="684" font-size="12" fill="#5b4b00">De bouwer keurt nooit zijn eigen</text>
  <text x="900" y="700" font-size="12" fill="#5b4b00">werk. De evaluator draait de echte</text>
  <text x="900" y="716" font-size="12" fill="#5b4b00">app en bewijst het gedrag, niet</text>
  <text x="900" y="732" font-size="12" fill="#5b4b00">alleen "tests groen".</text>

  <!-- sticky note: dispatch selector -->
  <rect x="28" y="372" width="286" height="96" rx="3" fill="#FEF3A3" stroke="#D9B40A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="396" font-size="12.5" font-weight="700" fill="#5b4b00">Kies de dispatch</text>
  <text x="42" y="416" font-size="12" fill="#5b4b00">Op vraag en budget: /goal als</text>
  <text x="42" y="432" font-size="12" fill="#5b4b00">standaard, Workflow-swarms per fase</text>
  <text x="42" y="448" font-size="12" fill="#5b4b00">alleen met credits, of /loop voor</text>
  <text x="42" y="464" font-size="12" fill="#5b4b00">terugkerende taken.</text>

  <!-- sticky note: per-phase team -->
  <rect x="886" y="470" width="286" height="98" rx="3" fill="#FEF3A3" stroke="#D9B40A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="900" y="494" font-size="12.5" font-weight="700" fill="#5b4b00">Per fase een team</text>
  <text x="900" y="514" font-size="12" fill="#5b4b00">De bouwer mag een zwerm specialisten</text>
  <text x="900" y="530" font-size="12" fill="#5b4b00">opzetten, elk met een eigen skillset.</text>
  <text x="900" y="546" font-size="12" fill="#5b4b00">Mist er een skill, dan haalt hij die</text>
  <text x="900" y="562" font-size="12" fill="#5b4b00">van skills.sh, of schrijft hem.</text>

  <!-- legend, bottom right -->
  <rect x="886" y="800" width="286" height="150" rx="10" fill="#ffffff" stroke="#e0e0e6" stroke-width="1.5"/>
  <text x="902" y="826" font-size="12.5" font-weight="700" fill="#3a3a42">Legenda</text>
  <rect x="902" y="840" width="14" height="14" rx="3" fill="#FFE6CC" stroke="#D79B00"/><text x="924" y="852" font-size="11.5" fill="#444">invoer</text>
  <rect x="902" y="864" width="14" height="14" rx="3" fill="#E1D5E7" stroke="#9673A6"/><text x="924" y="876" font-size="11.5" fill="#444">plannen</text>
  <rect x="902" y="888" width="14" height="14" rx="3" fill="#DAE8FC" stroke="#6C8EBF"/><text x="924" y="900" font-size="11.5" fill="#444">bouwen en bewijzen</text>
  <rect x="902" y="912" width="14" height="14" rx="3" fill="#FFF2CC" stroke="#D6B656"/><text x="924" y="924" font-size="11.5" fill="#444">jij beslist</text>
  <rect x="1050" y="840" width="14" height="14" rx="3" fill="#D5E8D4" stroke="#82B366"/><text x="1072" y="852" font-size="11.5" fill="#444">klaar</text>
  <rect x="1050" y="864" width="14" height="14" rx="3" fill="#FEF3A3" stroke="#D9B40A"/><text x="1072" y="876" font-size="11.5" fill="#444">uitleg</text>
  <line x1="1050" y1="895" x2="1066" y2="895" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/><text x="1072" y="900" font-size="11.5" fill="#444">herstel-lus, max 3x</text>
</svg>

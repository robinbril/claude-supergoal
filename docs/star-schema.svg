  <text x="1198" y="60" font-size="11" fill="#444"><tspan font-weight="700" fill="#b8860b">PK</tspan>  primary key (surrogate)</text>
  <text x="1198" y="76" font-size="11" fill="#444"><tspan font-weight="700" fill="#4f79b0">FK</tspan>  foreign key   <tspan font-weight="700" fill="#888">DD</tspan>  degenerate</text>
  <text x="1198" y="92" font-size="11" fill="#444"><tspan font-weight="700" fill="#5d8a3a">#</tspan>  measure (additief)</text>
  <path d="M1320,100 L1300,96 M1320,100 L1300,100 M1320,100 L1300,104" fill="none" stroke="#6b6b73" stroke-width="1.2"/>
  <text x="1328" y="104" font-size="11" fill="#444">1:N relatie</text>


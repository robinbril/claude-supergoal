<svg viewBox="0 0 1520 880" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="many" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M14,7 L1,1 M14,7 L1,7 M14,7 L1,13" fill="none" stroke="#6b6b73" stroke-width="1.3"/></marker>
    <marker id="one" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M7,2 L7,12" stroke="#6b6b73" stroke-width="1.3"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/></filter>
  </defs>

  <rect x="0" y="0" width="1520" height="880" fill="#f5f5f3"/>

  <text x="48" y="46" font-size="25" font-weight="700" fill="#1b1b1f">Supergoal, dimensioneel datamodel</text>
  <text x="48" y="72" font-size="13" fill="#6b6b73">Star schema. Grain: een door de evaluator beoordeelde fase-poging. Fact in het midden, dimensies eromheen.</text>

  <!-- legend -->
  <rect x="1182" y="22" width="290" height="86" rx="8" fill="#ffffff" stroke="#e0e0e6" stroke-width="1.2"/>
